syntax = "proto3";

option csharp_namespace = "KnowledgeManagement.Aggregator.Protos";
import "Protos/BlogComments/BlogCommentProtoMessages.proto";

//GET ALL CHALLENGES
message RequestAllBlogs
{
	int32 PageIndex = 1;
	int32 PageSize = 2;
	string SearchTerm = 3;
}

message ResponseAllBlogs
{
	repeated BlogProto Blog = 1;
	int32 PageIndex = 2;
	int32 TotalPages = 3;
	int32 TotalItems = 4;
	int32 PageSize = 5;
}

//GET CHALLENGE BY ID 
message RequestBlogById 
{
	string BlogId = 1;
}

message RequestBlogByIdPaginated
{
	string BlogId = 1;
	int32 PageIndex = 2;
	int32 PageSize = 3;
}

message ResponseBlogById
{
	BlogProto Blog = 1;
}

//GET ALL REQUESTED CHALLNEGES
message RequestAllRequestedBlogs
{
	int32 PageIndex = 1;
	int32 PageSize = 2;
	int32 RequestStage = 3;
}

//GET CONTROLLER AND ACTION NAMES
message GetBlogControllerAndActionNameResponse{
	repeated BlogModuleInfo ModuleInfo =1;
}
message BlogModuleInfo {
	string MethodVerd =1;
    string Path =2;
    string ControllerName =3;
    string ActionName =4;
    int64 key =5;
}

/*PROTO TYPES*/
message BlogProto
{
	string Id = 1;
	string Title = 2;
	string Description = 3;
	string CreatedBy = 4;
	string CreatedOn = 5;
	repeated BlogCommentProto BlogComments = 6;
	repeated BlogAttachmentProto BlogAttachments = 7;
	repeated BlogLikeProto BlogLikes = 8;
	string Notes = 9;
	int32 RequestStage = 10;
	bool IsDisliked = 11;
	bool IsLiked = 12; 
}

message BlogAttachmentProto
{
	string Id = 1;
	string BlogId = 2;
	string Path = 3;
}

message BlogLikeProto
{
	string Id = 1;
	int32 LikeStatus = 2;
	string BlogId = 3;
}