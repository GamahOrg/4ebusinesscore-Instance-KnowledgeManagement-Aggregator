syntax = "proto3";

option csharp_namespace = "Knowledge.API.Protos";

//GET ALL KNOWLEDGE
message RequestAllSubKnowledge
{
	int32 PageIndex = 1;
	int32 PageSize = 2;
	string Title = 3;
	string CreatedOn = 4;
	string SubKnowledgeId = 5;
	//string KnowledgeCategoryId = 6;
	//string SubKnowledgeCategoryId = 6;
	string OrgHierarchyId = 6;
	string KnowledgeId = 7;
	string TaggedWords = 8;
	string Date = 9;
	int32 KnowledgeType =10;
}

message ResponseAllSubKnowledge
{
	repeated AllSubKnowledgeProto SubKnowledge = 1;
	int32 PageIndex = 2;
	int32 TotalPages = 3;
	int32 TotalItems = 4;
	int32 PageSize = 5;
}
message RequestSubKnowledgeById
{
	string SubKnowledgeId = 1;
}

message ResponseSubKnowledgeById
{
	SubKnowledgeByIdProto SubKnowledge = 1;
}

/*PROTO TYPES*/
message AllSubKnowledgeProto
{
	string Id = 1;
	string Title = 2;
	string Details = 3;
	//string CategoryNameAr = 4;
	//string CategoryNameEn = 5;
	string CreatedOn = 4;
	string OrgHierarchyId = 5;
	int64 KnowledgeRates = 6;
	int32 KnowledgeViews = 7;
	int32 KnowledgeLikes = 8;
	int32 KnowledgeDislikes = 9;
	bool IsFavoirate = 10;
	bool IsDisliked = 11;
	bool IsLiked = 12; 
	string KnowledgeId = 13;
	string KnowledgeName = 14;
	string Date=15;
}

message SubKnowledgeByIdProto
{
	string Id = 1;
	string Title = 2;
	string Details = 3;
	string Targets = 4;
	string Legislation = 5;
	//string CategoryNameAr = 6;
	//string CategoryNameEn = 7;
	string CreatedOn = 6;
	string OrgHierarchyId = 7;
	int64 KnowledgeRates = 8;
	int32 KnowledgeViews = 9;
	int32 KnowledgeLikes = 10;
	int32 KnowledgeDislikes = 11;
	bool IsFavoirate = 12;
	repeated Attachment Attachment =13;
	repeated string ParticipatingParties = 14;
	repeated string WorkParticipants = 15;
	bool IsDisliked = 16;
	bool IsLiked = 17;
	string KnowledgeId = 18;
	string KnowledgeName = 19;
	string Date=20;
}

message Attachment{
	 string FileName = 1;
	 string FilePath = 2;
}
//GET CONTROLLER AND ACTION NAMES
message GetKnowledgeControllerAndActionNameResponse{
	repeated KnowledgeModuleInfo ModuleInfo =1;
}
message KnowledgeModuleInfo {
	string MethodVerd =1;
    string Path =2;
    string ControllerName =3;
    string ActionName =4;
    int64 key =5;
}